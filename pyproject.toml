[project]
name = "zh-tw-embedding-model-benchmark"
version = "0.2.0"
description = "繁體中文 Embedding / Reranker 模型檢索評測工具（Web UI + CLI，支援 /v1/embeddings）"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "datasets>=4.3.0",
    "flask>=3.1",
    "jieba>=0.42.1",
    "numpy>=2.3.4",
    "opencc>=1.1.9",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "requests>=2.32",
    "scipy>=1.14",
]

[project.optional-dependencies]
# 本地載入模型（sentence-transformers / transformers / FlagEmbedding / model2vec）時才需要
local = [
    "sentence-transformers>=6.1.0",
    "transformers>=5.19.0",
    "torch>=2.2",
    "FlagEmbedding>=1.3",
    "model2vec>=0.4",
]

[project.scripts]
embedbench = "embedbench.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["embedbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
